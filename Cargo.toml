[package]
name = "kalshi-latency-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A low-overhead Kalshi and live-sports latency recorder"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
futures-util = "0.3"
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
